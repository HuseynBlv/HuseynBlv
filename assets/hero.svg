<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Huseyn Balayev — Java backend engineer and product builder</title>
  <desc id="desc">A readable dark banner with a neon infrastructure topology in cyan, blue, and violet.</desc>

  <defs>
    <linearGradient id="bg" x1="38" y1="18" x2="1161" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050913"/>
      <stop offset="0.52" stop-color="#080E1D"/>
      <stop offset="1" stop-color="#100B25"/>
    </linearGradient>
    <linearGradient id="brand" x1="82" y1="162" x2="514" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="wire" x1="770" y1="95" x2="1082" y2="305" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="minorGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-opacity="0.035"/>
    </pattern>
    <pattern id="majorGrid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#60A5FA" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="20" y="20" width="1160" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    .wire { stroke-dasharray: 7 9; animation: flow 12s linear infinite; }
    .node { animation: node-pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-delay { animation-delay: -1.6s; }
    .packet-a { animation: packet-a 5.5s ease-in-out infinite; }
    .packet-b { animation: packet-b 6.5s ease-in-out infinite; }
    .status { animation: status 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: blink 1.05s steps(2, start) infinite; }
    @keyframes flow { to { stroke-dashoffset: -160; } }
    @keyframes node-pulse { 50% { transform: scale(1.08); opacity: .72; } }
    @keyframes packet-a { 0%, 10% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 90%, 100% { transform: translate(206px, 108px); opacity: 0; } }
    @keyframes packet-b { 0%, 10% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 90%, 100% { transform: translate(-202px, 105px); opacity: 0; } }
    @keyframes status { 50% { transform: scale(1.5); opacity: .5; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .wire, .node, .packet-a, .packet-b, .status, .cursor { animation: none; }
    }
  </style>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="124" cy="344" r="260" fill="url(#cyanGlow)" filter="url(#blur)"/>
    <circle cx="1135" cy="38" r="280" fill="url(#violetGlow)" filter="url(#blur)"/>
    <rect x="20" y="20" width="1160" height="340" fill="url(#minorGrid)"/>
    <rect x="20" y="20" width="1160" height="340" fill="url(#majorGrid)"/>
  </g>

  <rect x="20.75" y="20.75" width="1158.5" height="338.5" rx="21.25" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1.5"/>
  <path d="M21 76H1179" stroke="#94A3B8" stroke-opacity="0.16"/>
  <circle cx="51" cy="48" r="5.5" fill="#FB7185"/>
  <circle cx="71" cy="48" r="5.5" fill="#FBBF24"/>
  <circle cx="91" cy="48" r="5.5" fill="#34D399"/>
  <text x="116" y="53" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">INFRASTRUCTURE / PROFILE</text>
  <circle class="status" cx="1043" cy="48" r="4.5" fill="#34D399" filter="url(#glow)"/>
  <text x="1057" y="53" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ALL SYSTEMS ONLINE</text>

  <text x="64" y="120" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ resolve identity</text>
  <text x="62" y="183" fill="url(#brand)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="760" letter-spacing="-1.5">HUSEYN BALAYEV</text>
  <text x="64" y="222" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="0.4">JAVA BACKEND ENGINEER · PRODUCT BUILDER</text>
  <text x="64" y="264" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">reliable systems / clean boundaries / useful software</text>
  <rect class="cursor" x="516" y="250" width="8" height="18" rx="1" fill="#A78BFA"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <rect x="64" y="300" width="82" height="27" rx="13.5" fill="#0D1B2A" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="83" y="318" fill="#A5F3FC">APIs</text>
    <rect x="155" y="300" width="92" height="27" rx="13.5" fill="#0D172B" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="174" y="318" fill="#BFDBFE">DATA</text>
    <rect x="256" y="300" width="130" height="27" rx="13.5" fill="#15132B" stroke="#A78BFA" stroke-opacity="0.35"/>
    <text x="275" y="318" fill="#DDD6FE">OBSERVABILITY</text>
  </g>

  <path class="wire" d="M800 121L908 177L1016 120M908 177V279M1016 120L1090 190L1018 278M1090 190L1018 278M800 121L746 207L816 278M746 207L816 278M816 278L908 279L1018 278" stroke="url(#wire)" stroke-width="1.6" stroke-linecap="round"/>
  <circle class="packet-a" cx="802" cy="122" r="3.5" fill="#67E8F9" filter="url(#glow)"/>
  <circle class="packet-b" cx="1015" cy="121" r="3.5" fill="#C4B5FD" filter="url(#glow)"/>

  <g class="node">
    <rect x="763" y="98" width="78" height="44" rx="10" fill="#081725" stroke="#22D3EE" stroke-opacity="0.72"/>
    <text x="802" y="116" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">CLIENT</text>
    <text x="802" y="130" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">request</text>
  </g>
  <g class="node node-delay">
    <rect x="866" y="153" width="84" height="48" rx="11" fill="#0B162A" stroke="#60A5FA" stroke-opacity="0.78"/>
    <text x="908" y="173" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">SERVICE</text>
    <text x="908" y="188" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">domain</text>
  </g>
  <g class="node">
    <rect x="976" y="97" width="82" height="46" rx="10" fill="#12132A" stroke="#A78BFA" stroke-opacity="0.76"/>
    <text x="1017" y="116" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">QUEUE</text>
    <text x="1017" y="130" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">async</text>
  </g>
  <g class="node node-delay">
    <rect x="705" y="184" width="82" height="46" rx="10" fill="#081725" stroke="#22D3EE" stroke-opacity="0.58"/>
    <text x="746" y="203" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">GATEWAY</text>
    <text x="746" y="217" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">contract</text>
  </g>
  <g class="node">
    <rect x="1049" y="167" width="82" height="46" rx="10" fill="#151229" stroke="#A78BFA" stroke-opacity="0.62"/>
    <text x="1090" y="186" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">WORKER</text>
    <text x="1090" y="200" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">process</text>
  </g>
  <g class="node node-delay">
    <ellipse cx="816" cy="270" rx="43" ry="13" fill="#0A1726" stroke="#22D3EE" stroke-opacity="0.5"/>
    <path d="M773 270V289C773 296 792 302 816 302C840 302 859 296 859 289V270" fill="#0A1726" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="816" y="289" text-anchor="middle" fill="#A5F3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">CACHE</text>
  </g>
  <g class="node">
    <ellipse cx="908" cy="271" rx="43" ry="13" fill="#0D162A" stroke="#60A5FA" stroke-opacity="0.62"/>
    <path d="M865 271V290C865 297 884 303 908 303C932 303 951 297 951 290V271" fill="#0D162A" stroke="#60A5FA" stroke-opacity="0.62"/>
    <text x="908" y="290" text-anchor="middle" fill="#BFDBFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">DATABASE</text>
  </g>
  <g class="node node-delay">
    <rect x="975" y="255" width="86" height="46" rx="10" fill="#151229" stroke="#A78BFA" stroke-opacity="0.58"/>
    <text x="1018" y="275" text-anchor="middle" fill="#DDD6FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">METRICS</text>
    <text x="1018" y="289" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">observe</text>
  </g>
</svg>
